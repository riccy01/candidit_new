<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Post</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #222;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }

    .back a {
      text-decoration: none;
      color: #555;
      font-size: 14px;
    }

    h1 {
      font-size: 36px;
      margin: 20px 0 10px;
    }

    .meta {
      font-size: 13px;
      color: #888;
      margin-bottom: 30px;
    }

    .content {
      font-size: 18px;
      line-height: 1.7;
    }

    .content h1 {
      font-size: 30px;
      margin-top: 30px;
      margin-bottom: 12px;
    }

    .content h2 {
      font-size: 24px;
      margin-top: 28px;
      margin-bottom: 10px;
    }

    .content h3 {
      font-size: 20px;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .content p {
      margin: 16px 0;
    }

    .content ul,
    .content ol {
      padding-left: 24px;
      margin: 16px 0;
    }

    .content li {
      margin: 8px 0;
    }

    .content img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin: 24px 0;
      display: block;
    }

    .content a {
      color: #0066cc;
      text-decoration: none;
    }

    .content a:hover {
      text-decoration: underline;
    }

    .content blockquote {
      border-left: 4px solid #ddd;
      padding-left: 16px;
      margin: 20px 0;
      color: #666;
    }

    .content code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.95em;
    }

    .content pre {
      background: #f4f4f4;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="back">
      <a href="/blog/">← Back to blog</a>
    </div>

    <h1 id="title">Loading...</h1>
    <div class="meta" id="meta"></div>

    <div class="content" id="content">Loading post...</div>

  </div>

<script>
async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  const titleEl = document.getElementById("title");
  const metaEl = document.getElementById("meta");
  const contentEl = document.getElementById("content");

  if (!slug) {
    titleEl.innerText = "Post not found";
    contentEl.innerText = "Missing slug.";
    return;
  }

  try {
    // 1. Load index.json (single source of truth)
    const res = await fetch("/content/blog/index.json");
    const posts = await res.json();

    // 2. Find matching post
    const post = posts.find(p =>
      (p.slug || p.filename || "")
        .replace(".md", "")
        .trim()
        .toLowerCase() === slug.trim().toLowerCase()
    );

    if (!post) {
      titleEl.innerText = "Post not found";
      contentEl.innerText = "No matching post found.";
      return;
    }

    // 3. Set title + meta
    titleEl.innerText = post.title || "Untitled";
    metaEl.innerText = post.date || "";

    // 4. Load markdown file
    const mdRes = await fetch(`/content/blog/${post.filename}`);
    const mdText = await mdRes.text();

    // 5. Remove frontmatter
    const cleaned = mdText.replace(/^---[\s\S]*?---/, "").trim();

    // 6. Convert markdown → HTML (requires marked.js)
    const html = marked.parse(cleaned);

    contentEl.innerHTML = html;

  } catch (err) {
    console.error(err);
    titleEl.innerText = "Error loading post";
    contentEl.innerText = err.message;
  }
}

loadPost();
</script>

</body>
</html>
