  </style>

<nav>
  <a href="/">Home</a>

<div class="page-title">Candid Musings</div>
<div class="container" id="postContainer"></div>

<script>
async function loadPosts() {
  try {
    const res = await fetch('/content/blog/index.json');
    const posts = await res.json();

    for (const post of posts) {
      const mdRes = await fetch(`/content/blog/${post.filename}`);
      const mdText = await mdRes.text();

      const cleaned = mdText.replace(/^---[\s\S]*?---/, "").trim();

      // extract first image
      const imgMatch = cleaned.match(/!\[.*?\]\((.*?)\)/);
      post.image = imgMatch ? imgMatch[1] : "/images/default-blog.jpg";

      // excerpt without image markdown
      post.excerpt = cleaned
        .replace(/!\[.*?\]\((.*?)\)/g, "")
        .replace(/\n/g, " ")
        .substring(0, 180) + "...";
    }

    renderPosts(posts);

  } catch (err) {
    console.error(err);
    document.getElementById("postContainer").innerHTML =
      "<p>Error loading blog posts.</p>";
  }
}

function renderPosts(posts) {
  const container = document.getElementById("postContainer");
  container.innerHTML = "";

  posts.forEach(post => {
    const slug = (post.filename || "")
      .replace(".md", "")
      .trim()
      .toLowerCase();

    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <div>
        <div class="post-title">${post.title || ""}</div>
        <div class="post-meta">${post.date || ""}</div>
        <div class="post-excerpt">${post.excerpt || ""}</div>
        <a class="read-more" href="/blog/post?slug=${slug}">
          Read more →
        </a>
      </div>

      <img class="post-image" src="${post.image}">
    `;

    div.addEventListener("click", () => {
      window.location.href = `/blog/post?slug=${slug}`;
    });

    container.appendChild(div);
  });
}

loadPosts();
</script>
